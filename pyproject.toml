[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexpeak"
version = "0.1.0"
description = "Flexible, adaptive peak calling for ChIP-seq / CUT&RUN / CUT&Tag / ATAC-seq"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hua Huang" }]
keywords = ["chip-seq", "cut-and-run", "peak-calling", "epigenomics", "atac-seq"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
bam = ["pysam>=0.19"]
bigwig = ["pyBigWig>=0.3.18"]
report = ["pandas>=1.3", "jinja2>=3.0"]
fast = ["numba>=0.56"]
figures = ["matplotlib>=3.5"]
all = ["pysam>=0.19", "pyBigWig>=0.3.18", "pandas>=1.3", "jinja2>=3.0", "numba>=0.56",
       "matplotlib>=3.5"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
flexpeak = "flexpeak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
